# Runtime parameters — loaded by AgentRegistry, passed as Graph(config=...).
# This is a SEPARATE file from config/agent.yaml (the static manifest): agent.yaml
# is AgentRegistry's discovery entry point, this file is the agent's own runtime
# config, keyed by whatever your Graph/node code reads via self.config.get(...).
# See the framework's manifest documentation for the agent.yaml / config.yaml
# split of responsibility.

max_retry: 3
timeout_s: 30

# No HITL, no memory (propagate_hitl = False in src/graph/graph.py) — this
# template is a single-pass Q&A pipeline with no interrupt/resume flow.

# No "llm" key here — CareContextExtractNode builds its own AzureOpenAIClient
# fresh, per invocation, from AZURE_OPENAI_* secrets (ctx.secrets.require()),
# not from config. See docs/07_operation_guide.md.
